# Render Blueprint for the ByaheGo API (optional – you can also create the service by hand).
# In Render: New + → Blueprint → pick this repo. Fill in the secret values when asked.
services:
  - type: web
    name: byahego-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: ByaheGo
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false        # paste the key from: php artisan key:generate --show
      - key: APP_URL
        sync: false        # e.g. https://byahego-api.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false        # Neon DIRECT connection string (no "-pooler" in the host), ending ?sslmode=require
      - key: CORS_ALLOWED_ORIGINS
        sync: false        # your Vercel URL, e.g. https://byahego.vercel.app
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: SANCTUM_TOKEN_EXPIRATION
        value: "43200"      # minutes: a sign-in lasts 30 days
      - key: SEED_DEMO_DATA
        value: "false"      # true = create the demo renter, host and admin (needs DEMO_PASSWORD) into an EMPTY database
      - key: DEMO_PASSWORD
        sync: false        # at least 12 characters; only used when SEED_DEMO_DATA is true. Never put it in the repo
      - key: ADMIN_EMAIL
        sync: false        # optional: a real admin account created on deploy when it doesn't exist yet
      - key: ADMIN_PASSWORD
        sync: false        # at least 12 characters, used with ADMIN_EMAIL
      - key: SESSION_DRIVER
        value: array
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: VERIFICATION_AUTO_APPROVE
        value: "false"      # true = auto-approve clean ID submissions (auto-reject is always on)
      - key: FRONTEND_URL
        sync: false        # your Vercel URL, e.g. https://byahego.vercel.app (OAuth return + password reset links)
      - key: XENDIT_SECRET_KEY
        sync: false        # Xendit secret key (xnd_development_... while testing, xnd_production_... when live)
      - key: XENDIT_CALLBACK_TOKEN
        sync: false        # Xendit dashboard -> Settings -> Webhooks -> "Callback verification token"
      - key: GOOGLE_CLIENT_ID
        sync: false        # optional, for "Continue with Google"
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false        # optional, for "Continue with Facebook"
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
